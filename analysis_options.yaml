# Konfiguration des Dart-Analyzers fuer FindUX.
# Hinweis: strict-casts / strict-raw-types absichtlich NICHT aktiviert,
# damit Bestandsdateien (z. B. dynamische Hive-Maps) nicht brechen. Neue
# Module bleiben trotzdem strikt typisiert (siehe Code-Reviews).
include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    library_private_types_in_public_api: warning

    info: false
    warning: false
linter:
  rules:
    avoid_print: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    unnecessary_null_checks: true
