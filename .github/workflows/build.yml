name: Build APK (Debug + Release)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC"

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Flutter einrichten
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: 'stable'
          cache: true

      - name: Pub-Cache laden
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-

      - name: Gradle-Cache laden
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('android/app/build.gradle') }}
          restore-keys: gradle-

      - name: Abhängigkeiten installieren
        run: flutter pub get

      - name: App analysieren
        run: flutter analyze --no-fatal-infos

      # ── DEBUG ──────────────────────────────────────────────────────────────
      - name: Debug-APK bauen
        run: flutter build apk --debug --split-per-abi

      - name: Debug-APKs umbenennen
        run: |
          cd build/app/outputs/flutter-apk/
          for f in app-*-debug.apk; do
            ABI=$(echo "$f" | sed 's/app-//;s/-debug.apk//')
            mv "$f" "FindUX-DEBUG-#${{ github.run_number }}-${ABI}.apk"
          done
          echo "--- Debug APKs ---"
          ls -lh FindUX-DEBUG-*.apk

      - name: Debug-APKs hochladen
        uses: actions/upload-artifact@v4
        with:
          name: FindUX-DEBUG-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/FindUX-DEBUG-*.apk
          retention-days: 14

      # ── RELEASE (unsigned) ─────────────────────────────────────────────────
      - name: Release-APK bauen
        run: flutter build apk --release --split-per-abi

      - name: Release-APKs umbenennen
        run: |
          cd build/app/outputs/flutter-apk/
          for f in app-*-release.apk; do
            ABI=$(echo "$f" | sed 's/app-//;s/-release.apk//')
            mv "$f" "FindUX-RELEASE-#${{ github.run_number }}-${ABI}.apk"
          done
          echo "--- Release APKs ---"
          ls -lh FindUX-RELEASE-*.apk

      - name: Release-APKs hochladen
        uses: actions/upload-artifact@v4
        with:
          name: FindUX-RELEASE-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/FindUX-RELEASE-*.apk
          retention-days: 14
