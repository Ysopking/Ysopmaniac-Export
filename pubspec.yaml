name: findux_mobile
description: FindUX Mobile App
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.0.0
  local_auth: ^2.1.6
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.1.1
  flutter_inappwebview: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  pull_to_refresh: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mockito: ^5.0.0

  path: any
  mobile: any
flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "../logo_new.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "../logo_new.png"