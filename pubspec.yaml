name: findux_mobile
description: FindUX Mobile App
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.3.2
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  url_launcher: ^6.3.1
  file_picker: ^8.1.4
  flutter_inappwebview: ^6.1.5
  # Stage G: ZIP-Support fuer Google-Takeout-Importe (reine Dart-Lib).
  archive: ^3.6.1
  # Stage F Hardening (FLAG_SECURE) wird nativ in MainActivity.kt gesetzt
  # — keine externe Dependency noetig.

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mockito: ^5.4.4
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/logo.png
    - assets/legal/
    - assets/data/

# Adaptive Icon Background passt zur dunklen Logo-Farbe
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
  adaptive_icon_background: "#1A0F3D"
  adaptive_icon_foreground: "assets/logo.png"
  min_sdk_android: 21
