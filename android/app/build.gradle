plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

android {
    namespace = "io.findux.app"
    compileSdk = 36
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId = "io.findux.app"
        minSdkVersion 23
        targetSdk = 36
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    buildTypes {
        release {
            // R8/ProGuard: Kotlin + Dart-Boilerplate entfernen, Namen verschleiern.
            // Dart-eigener Algorithmus (taxonomy_weights, intent_analyzer etc.) wird
            // durch Flutters AOT-Kompilierung in libapp.so gebacken — fuer maximalen
            // Schutz zusaetzlich mit:
            //   flutter build apk --release --obfuscate --split-debug-info=./debug_info
            // Das debug_info-Verzeichnis NICHT veroeffentlichen!
            minifyEnabled true
            shrinkResources true
            proguardFiles(
                getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
            )
        }
        debug {
            // Kein Minify im Debug-Build — aber FLAG_SECURE gilt trotzdem
            // (gesetzt in MainActivity.kt, unabhaengig vom Build-Typ).
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

dependencies {
}
